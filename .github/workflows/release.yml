name: Build Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install release tooling
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Check JavaScript
        run: npm run check

      - name: Package extension
        run: npm run package

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: activity-status-extension
          path: dist/activity-status-extension.zip

  companion:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:companion:mac
            artifact: activity-status-companion-macos
          - os: windows-latest
            command: npm run dist:companion:win
            artifact: activity-status-companion-windows
          - os: ubuntu-latest
            command: npm run dist:companion:linux
            artifact: activity-status-companion-linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install release tooling
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build companion
        run: ${{ matrix.command }}

      - name: Upload companion package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: companion-dist/**
