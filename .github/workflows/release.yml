name: Build Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install release tooling
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Check JavaScript
        run: npm run check

      - name: Package extension
        run: npm run package

      - name: Package Chrome Web Store upload
        run: npm run package:webstore

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: activity-status-extension
          path: dist/activity-status-extension.zip
          if-no-files-found: error

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: discord-status-webstore
          path: dist/discord-status-webstore.zip
          if-no-files-found: error

  companion:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run dist:companion:tauri
            artifact: activity-status-companion-macos-arm64
            rust_target: ''
            artifact_glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-latest
            command: npm run dist:companion:tauri -- --target x86_64-apple-darwin
            artifact: activity-status-companion-macos-intel
            rust_target: x86_64-apple-darwin
            artifact_glob: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            command: npm run dist:companion:tauri
            artifact: activity-status-companion-windows
            rust_target: ''
            artifact_glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-latest
            command: npm run dist:companion:tauri
            artifact: activity-status-companion-linux
            rust_target: ''
            artifact_glob: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install release tooling
        run: npm ci

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build companion
        run: ${{ matrix.command }}

      - name: Upload companion package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [extension, companion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download extension package
        uses: actions/download-artifact@v4
        with:
          name: activity-status-extension
          path: release-assets/extension

      - name: Download Chrome Web Store package
        uses: actions/download-artifact@v4
        with:
          name: discord-status-webstore
          path: release-assets/webstore

      - name: Download macOS companion
        uses: actions/download-artifact@v4
        with:
          pattern: activity-status-companion-macos-*
          path: release-assets/macos
          merge-multiple: true

      - name: Download Windows companion
        uses: actions/download-artifact@v4
        with:
          name: activity-status-companion-windows
          path: release-assets/windows

      - name: Download Linux companion
        uses: actions/download-artifact@v4
        with:
          name: activity-status-companion-linux
          path: release-assets/linux

      - name: Generate checksums
        run: |
          find release-assets -type f \
            ! -name '*.blockmap' \
            -print0 | sort -z | xargs -0 shasum -a 256 > release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/extension/*
            release-assets/webstore/*
            release-assets/macos/*
            release-assets/windows/*
            release-assets/linux/*
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
