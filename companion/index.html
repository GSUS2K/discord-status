<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity Status Companion</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #181a20;
      --panel-soft: #20232b;
      --line: #30343f;
      --text: #f4f5f7;
      --muted: #a6adbb;
      --accent: #5865f2;
      --success: #2ecc71;
      --danger: #ff5f68;
      --warning: #f7c948;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: transparent;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .popover {
      width: 360px;
      min-height: 520px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      background: rgba(17, 18, 22, 0.98);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.42);
      overflow: hidden;
    }

    .hero {
      align-items: center;
      display: flex;
      gap: 12px;
      padding: 18px 18px 14px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
    }

    h1 {
      font-size: 16px;
      line-height: 1.1;
      margin: 0;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .status-band {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .status-cell {
      padding: 14px 18px;
    }

    .status-cell + .status-cell {
      border-left: 1px solid var(--line);
    }

    .label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .value {
      font-size: 15px;
      font-weight: 800;
      margin-top: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 7px;
      background: var(--muted);
    }

    .dot.ok {
      background: var(--success);
    }

    .dot.warn {
      background: var(--warning);
    }

    .dot.bad {
      background: var(--danger);
    }

    .activity {
      border-bottom: 1px solid var(--line);
      padding: 14px 18px;
    }

    .activity-title {
      font-size: 14px;
      font-weight: 800;
      margin-top: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 16px 18px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-soft);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      min-height: 42px;
      padding: 10px 12px;
    }

    button:hover {
      border-color: #545b70;
      background: #272b36;
    }

    .primary {
      border-color: rgba(46, 204, 113, 0.65);
      background: rgba(46, 204, 113, 0.2);
    }

    .danger {
      border-color: rgba(255, 95, 104, 0.6);
      color: #ffd1d4;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .menu-list {
      border-top: 1px solid var(--line);
      padding: 8px 0;
    }

    .menu-row {
      align-items: center;
      background: transparent;
      border: 0;
      border-radius: 0;
      display: flex;
      justify-content: space-between;
      min-height: 42px;
      padding: 10px 18px;
      width: 100%;
    }

    .menu-row:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: transparent;
    }

    .pill {
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--muted);
      font-size: 11px;
      padding: 3px 8px;
    }

    .log {
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      height: 66px;
      overflow: hidden;
      padding: 12px 18px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main class="popover">
    <section class="hero">
      <img class="logo" src="../extension/icons/icon128.png" alt="">
      <div>
        <h1>Activity Status</h1>
        <div class="subtle">Discord Rich Presence bridge</div>
      </div>
    </section>

    <section class="status-band">
      <div class="status-cell">
        <div class="label">Backend</div>
        <div id="backend" class="value"><span class="dot"></span>Checking</div>
      </div>
      <div class="status-cell">
        <div class="label">Discord RPC</div>
        <div id="discord" class="value"><span class="dot"></span>Checking</div>
      </div>
    </section>

    <section class="activity">
      <div class="label">Last Activity</div>
      <div id="activity" class="activity-title">None</div>
      <div id="rpcError" class="subtle"></div>
    </section>

    <section class="button-grid">
      <button id="start" class="primary">Start</button>
      <button id="stop" class="danger">Stop</button>
      <button id="restart" class="wide">Restart Backend</button>
    </section>

    <section class="menu-list">
      <button id="settings" class="menu-row">
        <span>Settings</span>
        <span class="pill">Preferences</span>
      </button>
      <button id="extensions" class="menu-row">
        <span>Open Chrome Extensions</span>
        <span class="pill">Chrome</span>
      </button>
      <button id="copyUrl" class="menu-row">
        <span>Copy Backend URL</span>
        <span id="urlPill" class="pill">localhost</span>
      </button>
      <button id="quit" class="menu-row">
        <span>Quit Companion</span>
        <span class="pill">Exit</span>
      </button>
    </section>

    <section id="log" class="log">Starting...</section>
  </main>

  <script>
    const backend = document.getElementById('backend');
    const discord = document.getElementById('discord');
    const activity = document.getElementById('activity');
    const rpcError = document.getElementById('rpcError');
    const log = document.getElementById('log');
    const urlPill = document.getElementById('urlPill');

    function dotClass(value, kind) {
      if (kind === 'backend') {
        if (value === 'online') return 'ok';
        if (value === 'starting') return 'warn';
        return 'bad';
      }
      if (value === 'connected') return 'ok';
      if (value === 'unknown') return 'warn';
      return 'bad';
    }

    function setStatus(status) {
      backend.innerHTML = `<span class="dot ${dotClass(status.backend, 'backend')}"></span>${status.backend}`;
      discord.innerHTML = `<span class="dot ${dotClass(status.discord, 'discord')}"></span>${status.discord}`;
      activity.textContent = status.lastActivity || 'None';
      rpcError.textContent = status.lastRpcError ? `RPC: ${status.lastRpcError}` : '';
      log.textContent = status.log || '';
      urlPill.textContent = new URL(status.url || 'http://localhost:3000').host;
    }

    async function refresh() {
      setStatus(await window.activityStatus.getStatus());
    }

    document.getElementById('start').addEventListener('click', async () => {
      setStatus(await window.activityStatus.startBackend());
    });

    document.getElementById('stop').addEventListener('click', async () => {
      setStatus(await window.activityStatus.stopBackend());
    });

    document.getElementById('restart').addEventListener('click', async () => {
      setStatus(await window.activityStatus.restartBackend());
    });

    document.getElementById('settings').addEventListener('click', () => {
      window.activityStatus.openSettings();
    });

    document.getElementById('extensions').addEventListener('click', () => {
      window.activityStatus.openExtensions();
    });

    document.getElementById('copyUrl').addEventListener('click', async () => {
      const status = await window.activityStatus.getStatus();
      window.activityStatus.copyText(status.url);
    });

    document.getElementById('quit').addEventListener('click', () => {
      window.activityStatus.quit();
    });

    window.activityStatus.onStatusUpdate(setStatus);
    refresh();
    setInterval(refresh, 2500);
  </script>
</body>
</html>
