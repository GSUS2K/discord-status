<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity Status Companion</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #181a20;
      --panel-soft: #20232b;
      --line: #30343f;
      --text: #f4f5f7;
      --muted: #a6adbb;
      --accent: #5865f2;
      --success: #2ecc71;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 22px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
    }

    h1 {
      font-size: 24px;
      margin: 0;
    }

    .lede {
      color: var(--muted);
      margin-top: 4px;
      font-size: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
      margin-bottom: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0f1014;
      padding: 12px;
    }

    .label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .value {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 750;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-soft);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      padding: 10px 14px;
    }

    button.primary {
      border-color: rgba(46, 204, 113, 0.75);
      background: rgba(46, 204, 113, 0.22);
    }

    button.danger {
      border-color: rgba(255, 107, 107, 0.55);
      color: #ffd3d3;
    }

    .log {
      border-radius: 6px;
      background: #0f1014;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      min-height: 58px;
      overflow: auto;
      padding: 12px;
      white-space: pre-wrap;
    }

    .option-row {
      align-items: center;
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .option-row input {
      accent-color: var(--accent);
      height: 16px;
      width: 16px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <header>
    <img src="../extension/icons/icon128.png" alt="">
    <div>
      <h1>Activity Status Companion</h1>
      <div class="lede">Runs the local Discord RPC bridge for your Chrome extension.</div>
    </div>
  </header>

  <section class="panel">
    <div class="grid">
      <div class="card">
        <div class="label">Backend</div>
        <div id="backend" class="value">Checking...</div>
      </div>
      <div class="card">
        <div class="label">Discord RPC</div>
        <div id="discord" class="value">Checking...</div>
      </div>
      <div class="card">
        <div class="label">Last Activity</div>
        <div id="activity" class="value">None</div>
      </div>
    </div>

    <div class="actions">
      <button id="start" class="primary">Start</button>
      <button id="stop" class="danger">Stop</button>
      <button id="extensions">Open Chrome Extensions</button>
      <button id="hide">Hide Window</button>
    </div>

    <label class="option-row">
      <input id="launchAtLogin" type="checkbox">
      <span>Launch companion at login</span>
    </label>

    <div class="hint">The companion keeps running in the menu bar/system tray. Closing or hiding this window will not stop your Discord status.</div>
  </section>

  <section class="panel">
    <div class="label">Backend Log</div>
    <div id="log" class="log">Starting...</div>
  </section>

  <script>
    const backend = document.getElementById('backend');
    const discord = document.getElementById('discord');
    const activity = document.getElementById('activity');
    const log = document.getElementById('log');
    const launchAtLogin = document.getElementById('launchAtLogin');

    async function refresh() {
      const status = await window.activityStatus.getStatus();
      backend.textContent = status.backend;
      discord.textContent = status.discord;
      activity.textContent = status.lastActivity;
      log.textContent = status.log || '';
    }

    document.getElementById('start').addEventListener('click', async () => {
      await window.activityStatus.startBackend();
      refresh();
    });

    document.getElementById('stop').addEventListener('click', async () => {
      await window.activityStatus.stopBackend();
      refresh();
    });

    document.getElementById('extensions').addEventListener('click', () => {
      window.activityStatus.openExtensions();
    });

    document.getElementById('hide').addEventListener('click', () => {
      window.activityStatus.hideWindow();
    });

    launchAtLogin.addEventListener('change', async () => {
      launchAtLogin.checked = await window.activityStatus.setLaunchAtLogin(launchAtLogin.checked);
    });

    window.activityStatus.onBackendLog(line => {
      log.textContent = line;
      refresh();
    });

    async function hydrateSettings() {
      launchAtLogin.checked = await window.activityStatus.getLaunchAtLogin();
    }

    hydrateSettings();
    refresh();
    setInterval(refresh, 2500);
  </script>
</body>
</html>
