<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Neon Harbor example poster</title>
  <desc id="desc">An original illustrated media poster used to demonstrate Discord Status artwork support.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071225"/><stop offset=".48" stop-color="#173a73"/><stop offset="1" stop-color="#07101b"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb768"/><stop offset="1" stop-color="#ff557c"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2c73ff"/><stop offset=".5" stop-color="#55ddd6"/><stop offset="1" stop-color="#214895"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="600" height="900" rx="34" fill="url(#sky)"/>
  <circle cx="420" cy="236" r="130" fill="#ff6e7e" opacity=".32" filter="url(#glow)"/>
  <circle cx="420" cy="236" r="92" fill="url(#sun)"/>
  <path d="M0 430 96 348l58 40 100-118 72 78 82-52 75 91 117-59v322H0Z" fill="#091426" opacity=".94"/>
  <path d="M0 560c110-32 192 29 296-4 105-34 199-25 304 10v334H0Z" fill="#07101d"/>
  <path d="M0 622c110-34 203 37 315-3 102-37 188-20 285 12" fill="none" stroke="url(#water)" stroke-width="14" opacity=".72"/>
  <path d="M70 694h460M114 744h372M164 794h274" stroke="#56d9d1" stroke-width="4" opacity=".35"/>
  <text x="48" y="92" fill="#64e4da" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="8">ORIGINAL SERIES</text>
  <text x="48" y="174" fill="#f7f9ff" font-family="Arial,sans-serif" font-size="72" font-weight="800">NEON</text>
  <text x="48" y="242" fill="#f7f9ff" font-family="Arial,sans-serif" font-size="72" font-weight="800">HARBOR</text>
  <text x="48" y="850" fill="#9db1cf" font-family="Arial,sans-serif" font-size="22">A Discord Status media example</text>
</svg>
