<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Discord Status Companion dashboard with real media examples</title>
  <desc id="desc">The companion shows Stranger Things as the current Discord activity and detected media from Spotify, Crunchyroll, and VLC.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b16"/><stop offset="1" stop-color="#102b4a"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4387ff"/><stop offset="1" stop-color="#1f5cda"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="28" stdDeviation="32" flood-opacity=".46"/></filter><clipPath id="hero"><rect width="280" height="158" rx="16"/></clipPath><clipPath id="thumb"><rect width="72" height="54" rx="10"/></clipPath></defs>
  <rect width="1280" height="800" rx="38" fill="url(#bg)"/><path d="M0 140c280 110 470-130 755-25s360-40 525 24" fill="none" stroke="#4387ff" stroke-width="2" opacity=".24"/>
  <g transform="translate(74 48)" filter="url(#shadow)"><rect width="1132" height="704" rx="28" fill="#071321" stroke="#31517c"/>
    <g transform="translate(26 20)"><image href="icon128.png" width="50" height="50"/><text x="68" y="23" fill="#f5f8ff" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="700">Discord Status Companion</text><text x="68" y="45" fill="#8fa2bf" font-family="Manrope,Arial,sans-serif" font-size="13">Current activity and desktop controls</text><circle cx="916" cy="24" r="6" fill="#66e3aa"/><text x="932" y="30" fill="#66e3aa" font-family="Manrope,Arial,sans-serif" font-size="15" font-weight="700">Discord connected</text></g>
    <line x1="26" y1="90" x2="1106" y2="90" stroke="#263c5c"/>
    <g transform="translate(26 112)"><rect width="1080" height="214" rx="20" fill="#102540" stroke="#3a5d8e"/><g transform="translate(20 28)" clip-path="url(#hero)"><image href="media/stranger-things-netflix.jpg" width="280" height="158" preserveAspectRatio="xMidYMid slice"/></g><rect x="268" y="146" width="42" height="42" rx="11" fill="#071321"/><text x="289" y="175" text-anchor="middle" fill="#e50914" font-family="Arial,sans-serif" font-size="29" font-weight="900">N</text><text x="334" y="48" fill="#70a6ff" font-family="Manrope,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SHOWING IN DISCORD · NETFLIX</text><text x="334" y="86" fill="#f5f8ff" font-family="Manrope,Arial,sans-serif" font-size="31" font-weight="700">Stranger Things</text><text x="334" y="118" fill="#b3c0d2" font-family="Manrope,Arial,sans-serif" font-size="16">S1 E1 · Chapter One: The Vanishing of Will Byers</text><text x="334" y="151" fill="#66e3aa" font-family="Manrope,Arial,sans-serif" font-size="14">Playing · 12:08 / 47:23</text><rect x="334" y="173" width="700" height="7" rx="4" fill="#2a3f5d"/><rect x="334" y="173" width="178" height="7" rx="4" fill="#4b8dff"/></g>
    <g transform="translate(26 344)"><rect width="1080" height="72" rx="17" fill="url(#blue)"/><path d="M32 25h23l-8-8m8 8-8 8M55 48H32l8 8m-8-8 8-8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="31" fill="#fff" font-family="Manrope,Arial,sans-serif" font-size="20" font-weight="700">Select activity</text><text x="78" y="52" fill="#dbe7ff" font-family="Manrope,Arial,sans-serif" font-size="12">Pick browser media, a desktop app, a game, or a custom status</text><text x="1034" y="44" fill="#fff" font-family="Arial,sans-serif" font-size="25">›</text></g>
    <text x="26" y="452" fill="#7d91b1" font-family="Manrope,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">ACTIVITY INBOX</text><text x="1106" y="452" text-anchor="end" fill="#66e3aa" font-family="Manrope,Arial,sans-serif" font-size="11" font-weight="700">3 sources ready</text>
