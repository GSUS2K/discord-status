    <g transform="translate(26 584)"><rect width="340" height="54" rx="14" fill="#10243a" stroke="#33725f"/><text x="170" y="34" text-anchor="middle" fill="#66e3aa" font-family="Manrope,Arial,sans-serif" font-size="14" font-weight="700">Pause updates</text><rect x="370" width="340" height="54" rx="14" fill="#0d1b2f" stroke="#2b4262"/><text x="540" y="34" text-anchor="middle" fill="#f5f8ff" font-family="Manrope,Arial,sans-serif" font-size="14" font-weight="700">Reconnect Discord</text><rect x="740" width="340" height="54" rx="14" fill="#0d1b2f" stroke="#2b4262"/><text x="910" y="34" text-anchor="middle" fill="#f5f8ff" font-family="Manrope,Arial,sans-serif" font-size="14" font-weight="700">Open settings</text></g>
