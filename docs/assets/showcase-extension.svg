<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Discord Status extension with real media examples</title>
  <desc id="desc">The extension dashboard showing Stranger Things on Netflix and detected activity from Crunchyroll, Hotstar, Spotify, and YouTube Music.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b16"/><stop offset="1" stop-color="#102b4a"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1728"/><stop offset="1" stop-color="#0c1d33"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4387ff"/><stop offset="1" stop-color="#1f5cda"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="28" stdDeviation="32" flood-opacity=".46"/></filter>
    <clipPath id="hero"><rect width="230" height="132" rx="15"/></clipPath>
    <clipPath id="thumb"><rect width="76" height="58" rx="10"/></clipPath>
  </defs>
  <rect width="1280" height="800" rx="38" fill="url(#bg)"/><circle cx="1090" cy="85" r="300" fill="#3979ff" opacity=".1"/><path d="M0 690c260-102 445 83 694-25s402 67 586-34" fill="none" stroke="#4387ff" stroke-width="2" opacity=".28"/>
  <g transform="translate(180 34)" filter="url(#shadow)"><rect width="920" height="732" rx="30" fill="url(#panel)" stroke="#31517c"/>
    <g transform="translate(30 24)"><image href="icon128.png" width="50" height="50"/><text x="66" y="23" fill="#f5f8ff" font-family="Manrope,Arial,sans-serif" font-size="23" font-weight="700">Discord Status</text><text x="66" y="45" fill="#8fa2bf" font-family="Manrope,Arial,sans-serif" font-size="13">Browser Rich Presence</text><circle cx="776" cy="24" r="6" fill="#66e3aa"/><text x="792" y="30" fill="#66e3aa" font-family="Manrope,Arial,sans-serif" font-size="15" font-weight="700">Discord connected</text></g>
    <line x1="30" y1="94" x2="890" y2="94" stroke="#263c5c"/>
    <text x="30" y="126" fill="#76a3ff" font-family="Manrope,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">CURRENT ACTIVITY</text>
    <g transform="translate(30 142)"><rect width="860" height="174" rx="20" fill="#122641" stroke="#3a5d8e"/>
      <g transform="translate(18 21)" clip-path="url(#hero)"><image href="media/stranger-things-netflix.jpg" width="230" height="132" preserveAspectRatio="xMidYMid slice"/></g>
      <rect x="215" y="118" width="42" height="42" rx="11" fill="#071321" stroke="#33445d"/><text x="236" y="147" text-anchor="middle" fill="#e50914" font-family="Arial,sans-serif" font-size="29" font-weight="900">N</text>
      <text x="276" y="44" fill="#70a6ff" font-family="Manrope,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">WATCHING · NETFLIX</text><text x="276" y="78" fill="#f5f8ff" font-family="Manrope,Arial,sans-serif" font-size="27" font-weight="700">Stranger Things</text><text x="276" y="106" fill="#b3c0d2" font-family="Manrope,Arial,sans-serif" font-size="15">S1 E1 · Chapter One: The Vanishing of Will Byers</text><text x="276" y="136" fill="#66e3aa" font-family="Manrope,Arial,sans-serif" font-size="13">Playing · 12:08 / 47:23</text><rect x="650" y="128" width="178" height="7" rx="4" fill="#2b3f5c"/><rect x="650" y="128" width="46" height="7" rx="4" fill="#4b8dff"/>
    </g>
    <g transform="translate(30 330)"><rect width="860" height="64" rx="15" fill="#091628" stroke="#263c5c"/><rect width="286" height="64" rx="15" fill="url(#blue)"/><text x="143" y="28" text-anchor="middle" fill="#fff" font-family="Manrope,Arial,sans-serif" font-size="16" font-weight="700">Auto Detect</text><text x="143" y="47" text-anchor="middle" fill="#dbe7ff" font-family="Manrope,Arial,sans-serif" font-size="10">Best activity automatically</text><text x="430" y="28" text-anchor="middle" fill="#f5f8ff" font-family="Manrope,Arial,sans-serif" font-size="16" font-weight="700">Active Tab</text><text x="430" y="47" text-anchor="middle" fill="#8294ad" font-family="Manrope,Arial,sans-serif" font-size="10">Only this tab</text><text x="716" y="28" text-anchor="middle" fill="#f5f8ff" font-family="Manrope,Arial,sans-serif" font-size="16" font-weight="700">Manual</text><text x="716" y="47" text-anchor="middle" fill="#8294ad" font-family="Manrope,Arial,sans-serif" font-size="10">Choose or write a status</text></g>
    <text x="30" y="430" fill="#7d91b1" font-family="Manrope,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">DETECTED SOURCES</text><text x="890" y="430" text-anchor="end" fill="#66e3aa" font-family="Manrope,Arial,sans-serif" font-size="11" font-weight="700">4 ready</text>
    <g transform="translate(30 448)">
      <g><rect width="420" height="102" rx="16" fill="#0d1b2f" stroke="#2b4262"/><g transform="translate(14 22)" clip-path="url(#thumb)"><image href="media/solo-leveling-crunchyroll.webp" width="76" height="58" preserveAspectRatio="xMidYMid slice"/></g><image href="site-icons/crunchyroll.png" x="72" y="60" width="25" height="25"/><text x="108" y="35" fill="#ff9b52" font-family="Manrope,Arial,sans-serif" font-size="10" font-weight="700">CRUNCHYROLL</text><text x="108" y="61" fill="#f5f8ff" font-family="Manrope,Arial,sans-serif" font-size="17" font-weight="700">Solo Leveling</text><text x="108" y="82" fill="#92a4bc" font-family="Manrope,Arial,sans-serif" font-size="12">S1 E1 · I’m Used to It</text></g>
      <g transform="translate(440)"><rect width="420" height="102" rx="16" fill="#0d1b2f" stroke="#2b4262"/><g transform="translate(14 22)" clip-path="url(#thumb)"><image href="media/loki-hotstar.jpg" width="76" height="58" preserveAspectRatio="xMidYMid slice"/></g><rect x="70" y="58" width="29" height="29" rx="8" fill="#f5f8ff"/><image href="site-icons/hotstar.png" x="72" y="68" width="25" height="8"/><text x="108" y="35" fill="#6fe0d5" font-family="Manrope,Arial,sans-serif" font-size="10" font-weight="700">HOTSTAR</text><text x="108" y="61" fill="#f5f8ff" font-family="Manrope,Arial,sans-serif" font-size="17" font-weight="700">Loki</text><text x="108" y="82" fill="#92a4bc" font-family="Manrope,Arial,sans-serif" font-size="12">S2 E1 · Ouroboros</text></g>
      <g transform="translate(0 116)"><rect width="420" height="102" rx="16" fill="#0d1b2f" stroke="#2b4262"/><g transform="translate(14 22)" clip-path="url(#thumb)"><image href="media/starboy-spotify.jpg" width="76" height="58" preserveAspectRatio="xMidYMid slice"/></g><image href="site-icons/spotify.png" x="72" y="60" width="25" height="25"/><text x="108" y="35" fill="#66e3aa" font-family="Manrope,Arial,sans-serif" font-size="10" font-weight="700">SPOTIFY</text><text x="108" y="61" fill="#f5f8ff" font-family="Manrope,Arial,sans-serif" font-size="17" font-weight="700">Starboy</text><text x="108" y="82" fill="#92a4bc" font-family="Manrope,Arial,sans-serif" font-size="12">The Weeknd · Daft Punk</text></g>
      <g transform="translate(440 116)"><rect width="420" height="102" rx="16" fill="#0d1b2f" stroke="#2b4262"/><g transform="translate(14 22)" clip-path="url(#thumb)"><image href="media/blinding-lights-youtube.jpg" width="76" height="58" preserveAspectRatio="xMidYMid slice"/></g><image href="site-icons/youtubemusic.png" x="72" y="60" width="25" height="25"/><text x="108" y="35" fill="#ff7474" font-family="Manrope,Arial,sans-serif" font-size="10" font-weight="700">YOUTUBE MUSIC</text><text x="108" y="61" fill="#f5f8ff" font-family="Manrope,Arial,sans-serif" font-size="17" font-weight="700">Blinding Lights</text><text x="108" y="82" fill="#92a4bc" font-family="Manrope,Arial,sans-serif" font-size="12">The Weeknd</text></g>
    </g>
  </g>
</svg>
