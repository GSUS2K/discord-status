<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Discord Status extension activity dashboard</title>
  <desc id="desc">A product preview of the extension showing media artwork, playback details, modes, and detected activity.</desc>
  <defs>
