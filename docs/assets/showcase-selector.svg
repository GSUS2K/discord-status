    </g>
    <g transform="translate(28 680)" font-family="Manrope,Arial,sans-serif" font-size="11"><text fill="#7f91aa">↑ ↓ navigate</text><text x="112" fill="#7f91aa">Enter select</text><text x="220" fill="#7f91aa">M manual activity</text><text x="1096" text-anchor="end" fill="#70a6ff" font-weight="700">Auto mode · Ctrl/Command + Shift + Y</text></g>
