    <line x1="0" y1="91" x2="1152" y2="91" stroke="#263c5c"/>
    <g transform="translate(28 108)" font-family="Manrope,Arial,sans-serif" font-size="13" font-weight="700"><rect width="74" height="38" rx="10" fill="#3979ff"/><text x="37" y="24" text-anchor="middle" fill="#fff">All</text><text x="112" y="24" fill="#8fa2bf">Watching</text><text x="210" y="24" fill="#8fa2bf">Listening</text><text x="312" y="24" fill="#8fa2bf">Apps</text><text x="367" y="24" fill="#8fa2bf">Custom</text><text x="1096" y="24" text-anchor="end" fill="#66e3aa">5 activities ready</text></g>
    <g transform="translate(28 165)">
