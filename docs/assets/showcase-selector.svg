<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Discord Status activity selector with real media examples</title>
  <desc id="desc">A searchable activity selector showing Netflix, Crunchyroll, Hotstar, Spotify, and YouTube Music with artwork and metadata.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b16"/><stop offset="1" stop-color="#102b4a"/></linearGradient><linearGradient id="selected" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17345f"/><stop offset="1" stop-color="#112844"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="28" stdDeviation="32" flood-opacity=".46"/></filter><clipPath id="wide"><rect width="156" height="88" rx="13"/></clipPath><clipPath id="square"><rect width="88" height="88" rx="13"/></clipPath></defs>
  <rect width="1280" height="800" rx="38" fill="url(#bg)"/><circle cx="1100" cy="60" r="290" fill="#3979ff" opacity=".09"/>
  <g transform="translate(64 42)" filter="url(#shadow)"><rect width="1152" height="716" rx="28" fill="#071321" stroke="#31517c"/>
