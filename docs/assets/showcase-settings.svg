<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Discord Status Companion settings</title>
  <desc id="desc">A product preview of the companion settings with navigation, controls, connection information, and update status.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101f"/><stop offset="1" stop-color="#102947"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3979ff"/><stop offset="1" stop-color="#1756ce"/></linearGradient></defs>
  <rect width="1280" height="800" rx="38" fill="url(#bg)"/>
  <g transform="translate(70 55)"><rect width="1140" height="690" rx="28" fill="#071321" stroke="#31517c"/><rect width="250" height="690" rx="28" fill="#09182b"/><line x1="250" y1="0" x2="250" y2="690" stroke="#263c5c"/>
    <image href="icon128.png" x="28" y="26" width="44" height="44"/><text x="84" y="55" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Discord Status</text>
    <g font-family="Arial,sans-serif" font-size="15" font-weight="700"><rect x="20" y="95" width="210" height="48" rx="12" fill="url(#blue)"/><text x="64" y="126" fill="#fff">General</text><text x="64" y="184" fill="#a4b3ca">Activity</text><text x="64" y="242" fill="#a4b3ca">Privacy</text><text x="64" y="300" fill="#a4b3ca">Shortcuts</text><text x="64" y="358" fill="#a4b3ca">Desktop apps</text><text x="64" y="416" fill="#a4b3ca">Diagnostics</text></g>
    <text x="290" y="64" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="34" font-weight="700">General</text><text x="290" y="94" fill="#8fa2bf" font-family="Arial,sans-serif" font-size="16">Basic settings and companion behavior</text>
    <g transform="translate(290 128)"><rect width="528" height="340" rx="20" fill="#0d1a2e" stroke="#263c5c"/>
      <text x="24" y="42" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Companion behavior</text>
      <g font-family="Arial,sans-serif"><text x="24" y="92" fill="#f5f8ff" font-size="15" font-weight="700">Launch at login</text><text x="24" y="113" fill="#8294ad" font-size="12">Start when you sign in</text><rect x="446" y="78" width="54" height="29" rx="15" fill="#2e865f"/><circle cx="485" cy="92" r="11" fill="#fff"/>
      <line x1="24" y1="136" x2="504" y2="136" stroke="#253753"/><text x="24" y="177" fill="#f5f8ff" font-size="15" font-weight="700">Auto-start backend</text><text x="24" y="198" fill="#8294ad" font-size="12">Connect to Discord automatically</text><rect x="446" y="163" width="54" height="29" rx="15" fill="#2e865f"/><circle cx="485" cy="177" r="11" fill="#fff"/>
      <line x1="24" y1="221" x2="504" y2="221" stroke="#253753"/><text x="24" y="262" fill="#f5f8ff" font-size="15" font-weight="700">Show in system tray</text><text x="24" y="283" fill="#8294ad" font-size="12">Keep controls available in the background</text><rect x="446" y="248" width="54" height="29" rx="15" fill="#2e865f"/><circle cx="485" cy="262" r="11" fill="#fff"/></g>
      <rect x="24" y="304" width="172" height="34" rx="9" fill="#102440" stroke="#31517c"/><text x="110" y="326" text-anchor="middle" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="12" font-weight="700">Open selector</text>
    </g>
    <g transform="translate(840 128)"><rect width="270" height="158" rx="20" fill="#0d1a2e" stroke="#263c5c"/><text x="22" y="38" fill="#8294ad" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">CONNECTION</text><circle cx="28" cy="74" r="7" fill="#66e3aa"/><text x="46" y="80" fill="#66e3aa" font-family="Arial,sans-serif" font-size="17" font-weight="700">Connected</text><text x="22" y="113" fill="#8294ad" font-family="Arial,sans-serif" font-size="12">Discord desktop is ready</text><rect x="22" y="126" width="226" height="1" fill="#263c5c"/></g>
    <g transform="translate(840 306)"><rect width="270" height="162" rx="20" fill="#0d1a2e" stroke="#263c5c"/><text x="22" y="38" fill="#8294ad" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">VERSION</text><text x="22" y="82" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">1.0.45</text><circle cx="230" cy="75" r="14" fill="#153c31" stroke="#66e3aa"/><path d="m224 75 4 4 8-9" fill="none" stroke="#66e3aa" stroke-width="3"/><text x="22" y="119" fill="#66e3aa" font-family="Arial,sans-serif" font-size="13" font-weight="700">You are up to date</text></g>
    <g transform="translate(290 490)"><rect width="820" height="156" rx="20" fill="#0d1a2e" stroke="#263c5c"/><text x="24" y="40" fill="#f5f8ff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Quick setup</text><text x="24" y="70" fill="#8294ad" font-family="Arial,sans-serif" font-size="13">Extension installed</text><text x="260" y="70" fill="#66e3aa" font-family="Arial,sans-serif" font-size="13" font-weight="700">Ready</text><text x="24" y="100" fill="#8294ad" font-family="Arial,sans-serif" font-size="13">Companion running</text><text x="260" y="100" fill="#66e3aa" font-family="Arial,sans-serif" font-size="13" font-weight="700">Online</text><rect x="558" y="52" width="232" height="54" rx="13" fill="url(#blue)"/><text x="674" y="84" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">Open setup guide</text></g>
