<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">Discord Status Chrome Web Store small promo tile</title>
  <desc id="desc">Discord Status showing recognizable activity from Netflix, Spotify, and Crunchyroll.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b16"/><stop offset="1" stop-color="#102b4a"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4387ff"/><stop offset="1" stop-color="#225bd4"/></linearGradient>
    <clipPath id="media"><rect width="55" height="42" rx="8"/></clipPath>
  </defs>
  <rect width="440" height="280" fill="url(#bg)"/>
  <circle cx="61" cy="26" r="110" fill="#3979ff" opacity=".12"/>
  <path d="M-20 255c112-70 173 11 258-25s137 20 222-35" fill="none" stroke="#4387ff" stroke-width="1.5" opacity=".35"/>
  <g transform="translate(24 24)">
    <image href="icon128.png" width="48" height="48"/>
    <text x="61" y="21" fill="#f6f8ff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Discord Status</text>
    <text x="61" y="42" fill="#91a3bb" font-family="Arial,sans-serif" font-size="11">Browser Rich Presence</text>
    <text x="0" y="96" fill="#f6f8ff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Your activity.</text>
    <text x="0" y="129" fill="#6f9fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">On Discord.</text>
    <text x="0" y="157" fill="#a8b6c9" font-family="Arial,sans-serif" font-size="12">Shows, music, apps, and games</text>
    <text x="0" y="174" fill="#a8b6c9" font-family="Arial,sans-serif" font-size="12">with titles, artwork, and progress.</text>
    <rect y="195" width="145" height="35" rx="11" fill="url(#blue)"/>
    <text x="72.5" y="217" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="700">Show what you are doing</text>
  </g>
  <g transform="translate(236 25)">
    <rect width="180" height="230" rx="20" fill="#0a1728" stroke="#31517c"/>
    <circle cx="20" cy="20" r="4" fill="#66e3aa"/><text x="31" y="24" fill="#c7d4e5" font-family="Arial,sans-serif" font-size="10" font-weight="700">Discord connected</text>
    <g transform="translate(13 43)"><rect width="154" height="54" rx="10" fill="#122641" stroke="#34557f"/><g transform="translate(7 6)" clip-path="url(#media)"><image href="media/stranger-things-netflix.jpg" width="55" height="42" preserveAspectRatio="xMidYMid slice"/></g><image href="site-icons/netflix.png" x="49" y="33" width="19" height="19"/><text x="71" y="21" fill="#70a6ff" font-family="Arial,sans-serif" font-size="7" font-weight="700">NETFLIX</text><text x="71" y="37" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700">Stranger Things</text><text x="71" y="49" fill="#8fa2ba" font-family="Arial,sans-serif" font-size="7">S1 E1 · Playing</text></g>
    <g transform="translate(13 107)"><rect width="154" height="48" rx="10" fill="#0d1b2f" stroke="#2b4262"/><g transform="translate(7 6)" clip-path="url(#media)"><image href="media/starboy-spotify.jpg" width="55" height="36" preserveAspectRatio="xMidYMid slice"/></g><image href="site-icons/spotify.png" x="49" y="26" width="19" height="19"/><text x="71" y="20" fill="#66e3aa" font-family="Arial,sans-serif" font-size="7" font-weight="700">SPOTIFY</text><text x="71" y="36" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700">Starboy</text></g>
    <g transform="translate(13 165)"><rect width="154" height="48" rx="10" fill="#0d1b2f" stroke="#2b4262"/><g transform="translate(7 6)" clip-path="url(#media)"><image href="media/solo-leveling-crunchyroll.webp" width="55" height="36" preserveAspectRatio="xMidYMid slice"/></g><image href="site-icons/crunchyroll.png" x="49" y="26" width="19" height="19"/><text x="71" y="20" fill="#ff9b52" font-family="Arial,sans-serif" font-size="7" font-weight="700">CRUNCHYROLL</text><text x="71" y="36" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700">Solo Leveling</text></g>
  </g>
</svg>
