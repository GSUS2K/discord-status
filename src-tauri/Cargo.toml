[package]
name = "activity-status-companion"
version = "1.0.51"
description = "Small cross-platform companion for Discord Status"
authors = ["GSUS2K <ganesh21112000@gmail.com>"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
axum = "0.8.7"
arboard = "3.6.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
discord-rich-presence = "1.1.0"
dirs = "6.0.0"
open = "5.3.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.3.6"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-shell = "2.3.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tauri-plugin-global-shortcut = "2.3.1"
