<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity Status Companion</title>
  <style>
    :root {
      color-scheme: dark;
      --glass: rgba(8, 11, 16, 0.82);
      --panel: rgba(255, 255, 255, 0.06);
      --panel-strong: rgba(255, 255, 255, 0.1);
      --line: rgba(126, 255, 199, 0.18);
      --text: #f5f7fb;
      --muted: #aeb6c7;
      --green: #6ff6bd;
      --red: #ff6573;
      --amber: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
    }

    button {
      font: inherit;
    }

    .popover {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      background:
        linear-gradient(145deg, rgba(91, 111, 255, 0.16), rgba(0, 0, 0, 0) 34%),
        radial-gradient(circle at 96% 16%, rgba(111, 246, 189, 0.15), transparent 30%),
        var(--glass);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.48);
      overflow: hidden;
      backdrop-filter: blur(26px) saturate(1.3);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .content {
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 14px;
      scrollbar-width: thin;
    }

    .content::-webkit-scrollbar {
      width: 8px;
    }

    .content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(8, 10, 14, 0.54);
      overflow: hidden;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .status-cell {
      padding: 13px 14px;
    }

    .status-cell + .status-cell {
      border-left: 1px solid var(--line);
    }

    .label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .value {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      margin-top: 5px;
      font-size: 15px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--muted);
      box-shadow: 0 0 16px currentColor;
    }

    .dot.ok {
      color: var(--green);
      background: var(--green);
    }

    .dot.warn {
      color: var(--amber);
      background: var(--amber);
    }

    .dot.bad {
      color: var(--red);
      background: var(--red);
    }

    .activity {
      margin-top: 12px;
      padding: 14px;
    }

    .activity-title {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 850;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .error {
      color: #ffb8be;
      min-height: 16px;
    }

    .inbox {
      margin-top: 12px;
      padding: 12px;
    }

    .inbox-list {
      display: grid;
      gap: 7px;
      margin-top: 9px;
      max-height: 132px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .activity-choice {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--text);
      cursor: pointer;
      padding: 9px 10px;
      text-align: left;
    }

    .choice-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .choice-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.92);
      padding: 3px;
      flex: 0 0 auto;
    }

    .choice-artwork {
      width: 42px;
      height: 28px;
      border-radius: 7px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.08);
      flex: 0 0 auto;
    }

    .choice-copy {
      min-width: 0;
      flex: 1;
    }

    .activity-choice:hover,
    .activity-choice.active {
      background: rgba(111, 246, 189, 0.12);
      border-color: rgba(111, 246, 189, 0.42);
    }

    .choice-title,
    .choice-meta {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .choice-title {
      font-size: 12px;
      font-weight: 850;
    }

    .choice-meta {
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .btn {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--text);
      background: var(--panel);
      cursor: pointer;
      font-size: 13px;
      font-weight: 850;
      padding: 10px 12px;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease, opacity 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: var(--panel-strong);
      border-color: rgba(255, 255, 255, 0.24);
    }

    .btn:disabled {
      cursor: default;
      opacity: 0.48;
      transform: none;
    }

    .primary {
      background: rgba(111, 246, 189, 0.16);
      border-color: rgba(111, 246, 189, 0.52);
    }

    .danger {
      background: rgba(255, 101, 115, 0.13);
      border-color: rgba(255, 101, 115, 0.5);
      color: #ffd9dd;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .menu {
      margin-top: 12px;
      overflow: hidden;
    }

    .row {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      padding: 11px 14px;
      text-align: left;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .row:disabled {
      cursor: default;
      opacity: 0.48;
    }

    .row:disabled:hover {
      background: transparent;
    }

    .row strong {
      font-size: 13px;
      font-weight: 850;
    }

    .pill {
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
    }

    .log {
      margin-top: 12px;
      padding: 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .toasts {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: grid;
      gap: 8px;
      pointer-events: none;
      z-index: 20;
    }

    .toast {
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      background: rgba(7, 10, 14, 0.92);
      color: var(--text);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
      padding: 10px 12px;
      opacity: 0;
      transform: translateY(8px);
      animation: toast-in 0.16s ease forwards;
    }

    .toast.ok {
      border-color: rgba(111, 246, 189, 0.42);
    }

    .toast.bad {
      border-color: rgba(255, 101, 115, 0.52);
      color: #ffd9dd;
    }

    @keyframes toast-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="popover">
    <section class="header">
      <img class="logo" src="icon128.png" alt="">
      <div>
        <h1>Activity Status</h1>
        <div class="subtle">Discord Rich Presence bridge</div>
      </div>
    </section>

    <section class="content">
      <section class="card status-grid">
        <div class="status-cell">
          <div class="label">Backend</div>
          <div id="backend" class="value"><span class="dot warn"></span>Checking</div>
        </div>
        <div class="status-cell">
          <div class="label">Discord RPC</div>
          <div id="discord" class="value"><span class="dot warn"></span>Checking</div>
        </div>
      </section>

      <section class="card activity">
        <div class="label">Last Activity</div>
        <div id="activity" class="activity-title">None</div>
        <div id="rpcError" class="subtle error"></div>
      </section>

      <section class="card inbox">
        <div class="label">Activity Inbox</div>
        <div id="activityInbox" class="inbox-list">
          <div class="subtle">Waiting for browser activity.</div>
        </div>
      </section>

      <section class="controls">
        <button id="start" class="btn primary">Start</button>
        <button id="stop" class="btn danger">Stop</button>
        <button id="restart" class="btn wide">Restart Backend</button>
        <button id="reconnect" class="btn wide">Reconnect Discord RPC</button>
        <button id="fix" class="btn wide">Fix Connection</button>
      </section>

      <section class="card menu">
        <button id="settings" class="row">
          <strong>Settings</strong>
          <span id="settingsShortcutPill" class="pill">Cmd/Ctrl + Alt + Shift + S</span>
        </button>
        <button id="selector" class="row">
          <strong>Select Discord Status</strong>
          <span id="selectorShortcutPill" class="pill">Cmd/Ctrl + Shift + Y</span>
        </button>
        <button id="extensions" class="row">
          <strong>Open Chrome Extensions</strong>
          <span class="pill">Chrome</span>
        </button>
        <button id="setupGuide" class="row">
          <strong>Open Setup Guide</strong>
          <span class="pill">Website</span>
        </button>
        <button id="copyUrl" class="row">
          <strong>Copy Backend URL</strong>
          <span id="urlPill" class="pill">localhost</span>
        </button>
        <button id="updates" class="row">
          <strong>Open Latest Release</strong>
          <span id="updatePill" class="pill">GitHub</span>
        </button>
        <button id="installUpdate" class="row">
          <strong>Copy Diagnostics</strong>
          <span class="pill">Debug</span>
        </button>
        <button id="quit" class="row">
          <strong>Quit Companion</strong>
          <span class="pill">Exit</span>
        </button>
      </section>

      <section id="log" class="card log">Companion ready.</section>
    </section>
  </main>
  <section id="toasts" class="toasts" aria-live="polite"></section>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const activityStatus = {
      getStatus: () => invoke('get_status'),
      startBackend: () => invoke('start_backend'),
      stopBackend: () => invoke('stop_backend'),
      restartBackend: () => invoke('restart_backend'),
      fixConnection: () => invoke('fix_connection'),
      reconnectRpc: () => invoke('reconnect_rpc'),
      selectActivity: activityId => invoke('select_activity_id', { activityId }),
      checkForUpdates: () => invoke('check_for_updates'),
      installUpdate: () => invoke('install_update'),
      openExtensions: () => invoke('open_chrome_extensions'),
      openSetupGuide: () => invoke('open_setup_guide'),
      openSettings: () => invoke('show_settings'),
      openSelector: () => invoke('show_selector'),
      getSettings: () => invoke('get_settings'),
      hideIfConfigured: () => invoke('hide_main_if_configured'),
      copyText: text => invoke('copy_text', { text }),
      quit: () => invoke('quit_app'),
      onStatusUpdate: callback => listen('status:update', event => callback(event.payload))
    };

    const backend = document.getElementById('backend');
    const discord = document.getElementById('discord');
    const activity = document.getElementById('activity');
    const rpcError = document.getElementById('rpcError');
    const activityInbox = document.getElementById('activityInbox');
    const log = document.getElementById('log');
    const urlPill = document.getElementById('urlPill');
    const updatePill = document.getElementById('updatePill');
    const settingsShortcutPill = document.getElementById('settingsShortcutPill');
    const selectorShortcutPill = document.getElementById('selectorShortcutPill');
    const installUpdate = document.getElementById('installUpdate');
    const toasts = document.getElementById('toasts');
    const SITE_ICON_ALIASES = {
      googlemeet: 'meet',
      manualactivity: 'manual',
      youtubemusic: 'youtube',
      googledocs: 'google',
      visualstudiocode: 'github'
    };
    const actionButtons = ['start', 'stop', 'restart', 'reconnect', 'fix'].map(id => document.getElementById(id));
    let busy = false;
    let lastToast = { message: '', time: 0 };

    function toast(message, kind = 'ok') {
      const now = Date.now();
      if (message === lastToast.message && now - lastToast.time < 1600) return;
      lastToast = { message, time: now };
      const item = document.createElement('div');
      item.className = `toast ${kind}`;
      item.textContent = message;
      toasts.append(item);
      setTimeout(() => item.remove(), 2600);
    }

    function errorMessage(error) {
      return typeof error === 'string' ? error : (error?.message || 'Something went wrong.');
    }

    function dotClass(value, kind) {
      if (kind === 'backend') {
        if (value === 'online') return 'ok';
        if (value === 'starting' || value === 'stopping') return 'warn';
        return 'bad';
      }
      if (value === 'connected') return 'ok';
      if (value === 'unknown') return 'warn';
      return 'bad';
    }

    function setLine(element, value, kind) {
      element.replaceChildren();
      const dot = document.createElement('span');
      dot.className = `dot ${dotClass(value, kind)}`;
      element.append(dot, document.createTextNode(value || 'unknown'));
    }

    function setStatus(status) {
      setLine(backend, status.backend, 'backend');
      setLine(discord, status.discord, 'discord');
      activity.textContent = status.lastActivity || 'None';
      rpcError.textContent = status.lastRpcError ? `RPC: ${status.lastRpcError}` : '';
      log.textContent = status.log || '';
      const update = status.update || {};
      updatePill.textContent = update.availableVersion || update.version || 'check';
      installUpdate.disabled = false;
      renderActivityInbox(status.activities || [], status.selectedActivityId || status.currentActivityId || null);
      try {
        urlPill.textContent = new URL(status.url || 'http://localhost:17654').host;
      } catch {
        urlPill.textContent = 'localhost';
      }
    }

    function renderActivityInbox(activities, selectedId) {
      activityInbox.textContent = '';
      if (!activities.length) {
        const empty = document.createElement('div');
        empty.className = 'subtle';
        empty.textContent = 'Waiting for browser activity.';
        activityInbox.append(empty);
        return;
      }

      for (const item of activities.slice(0, 6)) {
        const button = document.createElement('button');
        button.className = `activity-choice${item.id === selectedId ? ' active' : ''}`;
        button.type = 'button';

        const row = document.createElement('div');
        row.className = 'choice-row';

        const icon = createSiteIcon(item.platform);
        const artwork = createActivityArtwork(item);

        const copy = document.createElement('div');
        copy.className = 'choice-copy';

        const title = document.createElement('div');
        title.className = 'choice-title';
        title.textContent = `${item.isActiveTab ? 'Current - ' : ''}${item.platform || 'Browser'} - ${item.details || 'Activity'}`;

        const meta = document.createElement('div');
        meta.className = 'choice-meta';
        meta.textContent = item.state || item.tabTitle || 'Active';

        copy.append(title, meta);
        row.append(icon, copy, artwork);
        button.append(row);
        button.addEventListener('click', () => runAction(() => activityStatus.selectActivity(item.id), 'Activity selected.'));
        activityInbox.append(button);
      }
    }

    function createSiteIcon(platform) {
      const key = siteIconKey(platform);
      const img = document.createElement('img');
      img.className = 'choice-icon';
      img.alt = `${platform || 'Activity'} logo`;
      img.src = `site-icons/${key}.png`;
      img.addEventListener('error', () => {
        img.src = makeFallbackIcon(platform);
      }, { once: true });
      return img;
    }

    function createActivityArtwork(item) {
      const image = document.createElement('img');
      image.className = 'choice-artwork';
      image.alt = '';
      const source = String(item.thumbnailUrl || '').trim();
      if (!/^https?:\/\//i.test(source)) {
        image.style.display = 'none';
        return image;
      }
      image.src = source;
      image.addEventListener('error', () => image.remove(), { once: true });
      return image;
    }

    function makeFallbackIcon(platform = 'Activity') {
      const label = String(platform || 'Activity').trim();
      const letters = label
        .replace(/[^a-z0-9\s+]/gi, ' ')
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0].toUpperCase())
        .join('') || 'A';
      const hue = Math.abs([...label].reduce((sum, char) => sum + char.charCodeAt(0), 0)) % 360;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="hsl(${hue} 58% 24%)"/><circle cx="50" cy="14" r="7" fill="hsl(${(hue + 120) % 360} 80% 58%)"/><text x="32" y="39" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff">${letters}</text></svg>`;
      return `data:image/svg+xml,${encodeURIComponent(svg)}`;
    }

    function siteIconKey(platform = '') {
      const normalized = String(platform)
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '');
      return SITE_ICON_ALIASES[normalized] || normalized || 'manual';
    }

    async function refresh() {
      setStatus(await activityStatus.getStatus());
    }

    function shortcutLabel(value, fallback) {
      return String(value || fallback)
        .replace(/CommandOrControl/g, 'Cmd/Ctrl')
        .replace(/Command/g, 'Cmd')
        .replace(/Control/g, 'Ctrl')
        .replace(/Alt/g, 'Alt')
        .replace(/Option/g, 'Option')
        .replace(/Shift/g, 'Shift')
        .replace(/\+/g, ' + ');
    }

    async function refreshSettingsPills() {
      try {
        const settings = await activityStatus.getSettings();
        selectorShortcutPill.textContent = shortcutLabel(settings.selectorShortcut, 'CommandOrControl+Shift+Y');
        settingsShortcutPill.textContent = shortcutLabel(settings.settingsShortcut, 'CommandOrControl+Alt+Shift+S');
      } catch {
        selectorShortcutPill.textContent = 'Cmd/Ctrl + Shift + Y';
        settingsShortcutPill.textContent = 'Cmd/Ctrl + Alt + Shift + S';
      }
    }

    async function runAction(action, successMessage) {
      if (busy) return;
      busy = true;
      actionButtons.forEach(button => {
        button.disabled = true;
      });
      try {
        setStatus(await action());
        if (successMessage) toast(successMessage);
      } catch (error) {
        const message = errorMessage(error);
        log.textContent = message;
        toast(message, 'bad');
      } finally {
        busy = false;
        actionButtons.forEach(button => {
          button.disabled = false;
        });
      }
    }

    document.getElementById('start').addEventListener('click', () => runAction(activityStatus.startBackend, 'Backend started.'));
    document.getElementById('stop').addEventListener('click', () => runAction(activityStatus.stopBackend, 'Backend stopped.'));
    document.getElementById('restart').addEventListener('click', () => runAction(activityStatus.restartBackend, 'Backend restarted.'));
    document.getElementById('reconnect').addEventListener('click', () => runAction(activityStatus.reconnectRpc, 'Discord RPC reconnected.'));
    document.getElementById('fix').addEventListener('click', () => runAction(activityStatus.fixConnection, 'Connection repair finished.'));

    document.getElementById('settings').addEventListener('click', async () => {
      try {
        await activityStatus.openSettings();
        toast('Settings opened.');
      } catch (error) {
        toast(errorMessage(error), 'bad');
      }
    });
    document.getElementById('selector').addEventListener('click', async () => {
      try {
        await activityStatus.openSelector();
        toast('Selector opened.');
      } catch (error) {
        toast(errorMessage(error), 'bad');
      }
    });
    document.getElementById('extensions').addEventListener('click', async () => {
      try {
        await activityStatus.openExtensions();
        toast('Chrome extensions opened.');
      } catch (error) {
        toast(errorMessage(error), 'bad');
      }
    });
    document.getElementById('setupGuide').addEventListener('click', async () => {
      try {
        await activityStatus.openSetupGuide();
        toast('Setup guide opened.');
      } catch (error) {
        toast(errorMessage(error), 'bad');
      }
    });
    document.getElementById('updates').addEventListener('click', () => runAction(activityStatus.checkForUpdates, 'Latest release opened.'));
    installUpdate.addEventListener('click', async () => {
      try {
        const status = await activityStatus.getStatus();
        await activityStatus.copyText(JSON.stringify(status, null, 2));
        log.textContent = 'Diagnostics copied to clipboard.';
        toast('Diagnostics copied.');
      } catch (error) {
        toast(errorMessage(error), 'bad');
      }
    });
    document.getElementById('copyUrl').addEventListener('click', async () => {
      try {
        const status = await activityStatus.getStatus();
        await activityStatus.copyText(status.url);
        urlPill.textContent = 'copied';
        toast('Backend URL copied.');
        setTimeout(refresh, 900);
      } catch (error) {
        toast(errorMessage(error), 'bad');
      }
    });
    document.getElementById('quit').addEventListener('click', () => activityStatus.quit());

    activityStatus.onStatusUpdate(setStatus);
    window.addEventListener('blur', () => activityStatus.hideIfConfigured().catch(() => {}));
    refresh();
    refreshSettingsPills();
    setInterval(refresh, 2500);
    setInterval(refreshSettingsPills, 10000);
  </script>
</body>
</html>
