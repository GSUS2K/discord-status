<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Discord Status</title>
  <style>
    :root {
      color-scheme: dark;
      --glass: rgba(7, 10, 14, 0.78);
      --panel: rgba(255, 255, 255, 0.06);
      --panel-strong: rgba(111, 246, 189, 0.12);
      --line: rgba(126, 255, 199, 0.18);
      --text: #f5f7fb;
      --muted: #aeb6c7;
      --green: #6ff6bd;
      --red: #ff6573;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .selector {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 26px;
      background:
        linear-gradient(145deg, rgba(91, 111, 255, 0.18), rgba(0, 0, 0, 0) 38%),
        radial-gradient(circle at 94% 14%, rgba(111, 246, 189, 0.18), transparent 32%),
        var(--glass);
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.56);
      overflow: hidden;
      backdrop-filter: blur(30px) saturate(1.35);
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .search-icon {
      width: 24px;
      height: 24px;
      color: var(--muted);
      flex: 0 0 auto;
    }

    input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: 0;
    }

    input::placeholder {
      color: rgba(174, 182, 199, 0.72);
    }

    .list {
      display: grid;
      align-content: start;
      gap: 10px;
      padding: 14px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .list::-webkit-scrollbar {
      width: 8px;
    }

    .list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.16);
      border-radius: 999px;
    }

    .custom {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      padding: 12px 14px 0;
    }

    .custom input {
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      padding: 0 12px;
    }

    .custom button {
      min-height: 42px;
      border: 1px solid rgba(111, 246, 189, 0.42);
      border-radius: 14px;
      background: rgba(111, 246, 189, 0.14);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 900;
      padding: 0 14px;
    }

    .custom button:disabled {
      cursor: default;
      opacity: 0.48;
    }

    .item {
      width: 100%;
      min-height: 84px;
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      padding: 12px;
      text-align: left;
    }

    .item:hover,
    .item.active {
      background: var(--panel-strong);
      border-color: rgba(111, 246, 189, 0.46);
    }

    .item.selected {
      box-shadow: inset 0 0 0 1px rgba(111, 246, 189, 0.34);
    }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.92);
      padding: 5px;
    }

    .artwork {
      width: 64px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.08);
    }

    .copy {
      min-width: 0;
    }

    .title {
      font-size: 15px;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      padding: 5px 9px;
    }

    .badge.current {
      background: rgba(111, 246, 189, 0.16);
      color: var(--green);
    }

    .empty {
      margin: 44px auto 0;
      max-width: 380px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.45;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      padding: 11px 16px;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .auto-button {
      border: 1px solid rgba(111, 246, 189, 0.32);
      border-radius: 999px;
      background: rgba(111, 246, 189, 0.1);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 900;
      padding: 6px 10px;
    }

    .auto-button:hover {
      background: rgba(111, 246, 189, 0.18);
    }

    kbd {
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font: inherit;
      font-size: 10px;
      padding: 2px 6px;
    }
  </style>
  <style>
    :root { --line: rgba(169, 186, 220, .16); --panel: rgba(18, 25, 39, .86); --panel-strong: rgba(124, 140, 255, .15); --green: #72e1a5; }
    body { font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif; }
    .selector { border-color: rgba(169, 186, 220, .18); border-radius: 20px; background: radial-gradient(circle at 100% 0, rgba(124, 140, 255, .2), transparent 34%), rgba(11, 16, 27, .96); box-shadow: 0 30px 90px rgba(0, 0, 0, .52); }
    .search { padding: 17px 18px; border-color: var(--line); }
    input { font-family: "Space Grotesk", ui-sans-serif, sans-serif; letter-spacing: -.03em; }
    .item { border-color: rgba(169, 186, 220, .14); border-radius: 13px; background: rgba(255, 255, 255, .04); }
    .item:hover, .item.active { border-color: rgba(124, 140, 255, .62); background: rgba(124, 140, 255, .12); }
    .title { font-family: "Space Grotesk", ui-sans-serif, sans-serif; letter-spacing: -.02em; }
    .custom input { border-color: rgba(169, 186, 220, .16); border-radius: 10px; background: #0b111c; }
    .custom button { border-color: rgba(114, 225, 165, .58); border-radius: 10px; background: rgba(114, 225, 165, .15); }
    .footer { border-color: var(--line); }
    .auto-button { border-color: rgba(124, 140, 255, .54); background: rgba(124, 140, 255, .12); }
    .icon { width: 48px; height: 48px; border-radius: 12px; padding: 6px; background: #26334a; }
    .artwork { width: 76px; height: 50px; border-radius: 9px; }
  </style>
  <link rel="stylesheet" href="selector-redesign.css">
  <link rel="stylesheet" href="selector-polish.css">
</head>
<body>
  <main class="selector">
    <section class="search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="query" autocomplete="off" spellcheck="false" placeholder="Search activity to show in Discord">
      <kbd>Esc</kbd>
    </section>

    <section class="filters" aria-label="Activity type">
      <button class="filter active" type="button" data-filter="all">All</button>
      <button class="filter" type="button" data-filter="watching">Watching</button>
      <button class="filter" type="button" data-filter="listening">Listening</button>
      <button class="filter" type="button" data-filter="apps">Apps</button>
      <button class="filter" type="button" data-filter="custom">Custom</button>
    </section>

    <section class="custom" aria-label="Custom status">
      <input id="customTitle" autocomplete="off" spellcheck="false" maxlength="128" placeholder="Custom title">
      <input id="customMessage" autocomplete="off" spellcheck="false" maxlength="128" placeholder="Message">
      <button id="customSet" type="button">Set</button>
    </section>

    <section id="list" class="list"></section>

    <section class="footer">
      <span><kbd>↑</kbd> <kbd>↓</kbd> move · <kbd>Enter</kbd> select · <kbd>Esc</kbd> close</span>
      <span class="footer-actions">
        <button id="autoMode" class="auto-button" type="button">Auto mode</button>
        <span id="shortcut">CommandOrControl+Shift+Y</span>
      </span>
    </section>
  </main>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    const api = {
      getStatus: () => invoke('get_status'),
      getSettings: () => invoke('get_settings'),
      selectActivity: activityId => invoke('select_activity_id', { activityId }),
      setCustomActivity: request => invoke('set_custom_activity', { request }),
      hide: () => invoke('hide_selector'),
      onStatusUpdate: callback => listen('status:update', event => callback(event.payload))
    };

    const query = document.getElementById('query');
    const customTitle = document.getElementById('customTitle');
    const customMessage = document.getElementById('customMessage');
    const customSet = document.getElementById('customSet');
    const autoMode = document.getElementById('autoMode');
    const list = document.getElementById('list');
    const shortcut = document.getElementById('shortcut');
    const SITE_ICON_ALIASES = {
      googlemeet: 'meet',
      manualactivity: 'manual',
      visualstudiocode: 'vscode'
    };
    let status = null;
    let filtered = [];
    let activeIndex = 0;
    let pollTimer = null;
    let isSelecting = false;
    let activeFilter = 'all';

    function focusSearch() {
      requestAnimationFrame(() => {
        query.focus({ preventScroll: true });
        query.select();
      });
      setTimeout(() => {
        query.focus({ preventScroll: true });
        query.select();
      }, 80);
    }

    function searchableText(item) {
      return [
        item.platform,
        item.details,
        item.state,
        item.tabTitle,
        item.url
      ].filter(Boolean).join(' ').toLowerCase();
    }

    function refreshFilter() {
      const previousActiveId = filtered[activeIndex]?.id;
      const needle = query.value.trim().toLowerCase();
      const activities = status?.activities || [];
      const byType = activities.filter(item => matchesFilter(item, activeFilter));
      filtered = needle ? byType.filter(item => searchableText(item).includes(needle)) : byType;
      const previousIndex = previousActiveId
        ? filtered.findIndex(item => item.id === previousActiveId)
        : -1;
      activeIndex = previousIndex >= 0
        ? previousIndex
        : Math.min(activeIndex, Math.max(filtered.length - 1, 0));
      render();
    }

    function render() {
      list.textContent = '';
      list.classList.toggle('is-empty', !filtered.length);
      if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        const icon = document.createElement('img');
        icon.src = 'icon128.png';
        icon.alt = '';
        const title = document.createElement('b');
        title.textContent = status?.activities?.length ? 'No matching activity' : 'Nothing detected yet';
        const message = document.createElement('span');
        message.textContent = status?.activities?.length
          ? 'Try a different search or activity type.'
          : 'Open supported media, an app, or a game. You can also create a custom activity now.';
        const custom = document.createElement('button');
        custom.type = 'button';
        custom.textContent = 'Create custom activity';
        custom.addEventListener('pointerdown', event => {
          event.preventDefault();
          activeFilter = 'custom';
          document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item.dataset.filter === 'custom'));
          document.querySelector('.custom').classList.add('visible');
          customTitle.focus();
        });
        empty.append(icon, title, message, custom);
        list.append(empty);
        return;
      }

      filtered.slice(0, 12).forEach((item, index) => {
        const button = document.createElement('button');
        button.className = [
          'item',
          index === activeIndex ? 'active' : '',
          item.id === status?.selectedActivityId || item.id === status?.currentActivityId ? 'selected' : ''
        ].filter(Boolean).join(' ');
        button.type = 'button';

        const icon = createSiteIcon(item.platform);
        const artwork = createActivityArtwork(item);
        const media = document.createElement('div');
        media.className = 'item-media';
        media.append(icon, artwork);
        const copy = document.createElement('div');
        copy.className = 'copy';

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = item.details || item.tabTitle || item.platform || 'Untitled';

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = [item.episodeLabel, item.state, item.platform].filter(Boolean).join(' · ') || 'Ready';

        const badge = document.createElement('span');
        badge.className = `badge${item.isActiveTab ? ' current' : ''}`;
        const isSelected = item.id === status?.selectedActivityId || item.id === status?.currentActivityId;
        badge.textContent = isSelected ? 'selected' : (item.isActiveTab ? 'current tab' : 'saved');

        copy.append(title, meta);
        button.append(media, copy, badge);
        button.addEventListener('pointerenter', () => {
          activeIndex = index;
          for (const child of list.querySelectorAll('.item')) {
            child.classList.remove('active');
          }
          button.classList.add('active');
        });
        button.addEventListener('pointerdown', event => {
          event.preventDefault();
          activeIndex = index;
          selectActive(index);
        });
        list.append(button);
      });
    }

    function createSiteIcon(platform) {
      const key = siteIconKey(platform);
      const img = document.createElement('img');
      img.className = 'icon';
      img.alt = `${platform || 'Activity'} logo`;
      img.src = `site-icons/${key}.png`;
      img.addEventListener('error', () => {
        img.src = makeFallbackIcon(platform);
      }, { once: true });
      return img;
    }

    function createActivityArtwork(item) {
      const image = document.createElement('img');
      image.className = 'artwork';
      image.alt = '';
      const source = String(item.thumbnailUrl || '').trim();
      if (!/^https?:\/\//i.test(source)) {
        image.style.display = 'none';
        return image;
      }
      image.src = source;
      image.addEventListener('load', () => image.parentElement?.classList.add('has-artwork'), { once: true });
      image.addEventListener('error', () => image.remove(), { once: true });
      return image;
    }

    function matchesFilter(item, filter) {
      if (filter === 'all') return true;
      if (filter === 'custom') return String(item.platform || '').toLowerCase() === 'custom';
      const source = `${item.platform || ''} ${item.state || ''}`.toLowerCase();
      if (filter === 'watching') return /watch|netflix|youtube|twitch|prime|hulu|disney|crunchy|hotstar|apple tv/.test(source);
      if (filter === 'listening') return /listen|spotify|music|soundcloud|bandcamp/.test(source);
      return !/watch|listen|netflix|youtube|twitch|spotify|music|prime|hulu|disney|crunchy|hotstar|soundcloud|bandcamp/.test(source);
    }

    function makeFallbackIcon(platform = 'Activity') {
      const label = String(platform || 'Activity').trim();
      const letters = label
        .replace(/[^a-z0-9\s+]/gi, ' ')
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0].toUpperCase())
        .join('') || 'A';
      const hue = Math.abs([...label].reduce((sum, char) => sum + char.charCodeAt(0), 0)) % 360;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="hsl(${hue} 58% 24%)"/><circle cx="50" cy="14" r="7" fill="hsl(${(hue + 120) % 360} 80% 58%)"/><text x="32" y="39" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff">${letters}</text></svg>`;
      return `data:image/svg+xml,${encodeURIComponent(svg)}`;
    }

    function siteIconKey(platform = '') {
      const normalized = String(platform)
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '');
      return SITE_ICON_ALIASES[normalized] || normalized || 'manual';
    }

    async function selectActive(index = activeIndex) {
      const item = filtered[index];
      if (!item || isSelecting) return;
      isSelecting = true;
      try {
        status = await api.selectActivity(item.id);
        activeIndex = Math.max(filtered.findIndex(activity => activity.id === item.id), 0);
        refreshFilter();
      } catch (error) {
        console.warn('Selection failed', error);
      } finally {
        isSelecting = false;
      }
    }

    async function returnToAutoMode() {
      if (isSelecting) return;
      isSelecting = true;
      autoMode.disabled = true;
      try {
        status = await api.selectActivity(null);
        query.value = '';
        refreshFilter();
      } catch (error) {
        console.warn('Auto mode failed', error);
      } finally {
        autoMode.disabled = false;
        isSelecting = false;
      }
    }

    async function syncStatus() {
      status = await api.getStatus();
      refreshFilter();
    }

    function ensurePolling() {
      if (!pollTimer) {
        pollTimer = setInterval(() => syncStatus().catch(() => {}), 1000);
      }
    }

    async function load() {
      await syncStatus();
      const settings = await api.getSettings().catch(() => null);
      if (settings?.selectorShortcut) shortcut.textContent = settings.selectorShortcut;
      focusSearch();
    }

    query.addEventListener('input', refreshFilter);
    for (const button of document.querySelectorAll('.filter')) {
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        activeFilter = button.dataset.filter;
        document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button));
        document.querySelector('.custom').classList.toggle('visible', activeFilter === 'custom');
        refreshFilter();
      });
    }
    customSet.addEventListener('pointerdown', async event => {
      event.preventDefault();
      setCustomStatus();
    });
    autoMode.addEventListener('pointerdown', event => {
      event.preventDefault();
      returnToAutoMode();
    });

    async function setCustomStatus() {
      const title = customTitle.value.trim();
      const message = customMessage.value.trim();
      if (!title || isSelecting) return;
      isSelecting = true;
      customSet.disabled = true;
      try {
        status = await api.setCustomActivity({ title, message });
        query.value = '';
        refreshFilter();
      } catch (error) {
        console.warn('Custom status failed', error);
      } finally {
        customSet.disabled = false;
        isSelecting = false;
      }
    }

    for (const input of [customTitle, customMessage]) {
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
          event.preventDefault();
          setCustomStatus();
        }
      });
    }
    document.addEventListener('keydown', event => {
      if (event.target === customTitle || event.target === customMessage) return;
      if (event.key === 'Escape') {
        api.hide();
      } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        activeIndex = Math.min(activeIndex + 1, Math.max(filtered.length - 1, 0));
        render();
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        render();
      } else if (event.key === 'Enter') {
        event.preventDefault();
        selectActive();
      }
    });

    api.onStatusUpdate(nextStatus => {
      status = nextStatus;
      refreshFilter();
    });
    listen('selector:opened', () => {
      load().catch(() => {});
      ensurePolling();
      focusSearch();
    });
    window.addEventListener('focus', () => {
      focusSearch();
      ensurePolling();
      load().catch(() => {});
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      } else if (!document.hidden && !pollTimer) {
        ensurePolling();
      }
    });
    ensurePolling();
    load().catch(() => {});
  </script>
</body>
</html>
